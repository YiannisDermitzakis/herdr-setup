# herdr-setup is a collection of scripts, not an installable package. This file
# exists so `uv` can pin the interpreter and the development tools, which is the
# same guarantee the tool itself offers its users: the same versions everywhere.
[project]
name = "herdr-setup"
version = "0.1.0"
description = "Reproduce and sync a Herdr setup across machines."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
# shellcheck is pinned EXACTLY: a runner image's shellcheck (0.9.0) and a
# developer's (0.11.0) gave different verdicts on the same line, so the gate
# meant different things in two places. shellcheck-py ships the binary as a
# wheel, so `uv run --group dev shellcheck` is the same everywhere.
dev = ["pytest>=8", "ruff>=0.9", "shellcheck-py==0.11.0.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
# Adapters are PEP 723 uv scripts named after the agent they cover, with no
# .py suffix (adapters/claude, adapters/codex, ...) so `herdr-setup feed`
# can discover them by executability alone. Ruff's own file discovery looks
# at extensions, so without this an invocation over a directory --
# `ruff check adapters/`, or the CI job phase 10 wires up over `adapters/`
# -- silently finds "No Python files" and lints nothing there, while still
# exiting 0. Passing the files by name (`ruff check adapters/claude`) always
# worked; this is what makes the directory form work the same way.
#
# A future non-Python file under adapters/ -- a README, matching what
# lib/feed.py's own discover() already ignores -- must not be swept in and
# handed to ruff as if it were Python, so `.md` is carved back out.
#
# The fake gh in tests/helpers/ is a PEP 723 script with no suffix for the
# same reason (it is found on PATH by command name), so it is named here too
# rather than left unlinted.
extend-include = ["adapters/*", "tests/helpers/fake-gh"]
extend-exclude = ["adapters/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
