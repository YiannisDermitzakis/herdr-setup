# Acceptance matrix — the registry of business-level acceptance tests and
# where each is verified. Rendered by `fr acceptance report`; gated in CI by
# .github/workflows/acceptance-report.yml (`fr acceptance check`).
#
# Row schema:
#   id:         kebab-case, stable
#   capability: grouping (tables render in first-seen order)
#   acceptance: the business-level statement
#   origin:     list of "repo:path[#anchor]" refs (spec §, design doc)
#   levels:     unit/api/int/ui → list of "repo:path[#Lline]" test refs
#               ([] = level does not verify this row)
#   status:     ci | scheduled | skipped | not-implemented | failing
#     ci               automated on every PR — cannot drift silently
#     scheduled        automated on cron/path triggers
#     skipped          verification exists but does not run in CI (proven
#                      live once / manual walk) → CI warning, backfill owed
#     not-implemented  no test or surface exists yet → CI warning
#     failing          known red → `fr acceptance check` exits 2, CI FAILS
#   notes:      evidence detail, drift context
#
# Rule: .claude/rules/acceptance-matrix.md — update rows in the SAME PR that
# changes a Test Plan, adds tests, ships a surface, or touches CI.
# Add rows with `fr acceptance add` (schema-validated append). Keep `rows:`
# as the LAST top-level key — `add` appends to the end of this file.

org: YiannisDermitzakis
repo: herdr-setup
rows:
  - id: diff-runs-under-protocol-mismatch
    capability: Version gate
    acceptance: diff reports plugins, config and integration state in full even when
      the Herdr command line and the running server speak different protocol versions.
    origin:
    - herdr-setup:docs/superpowers/specs/2026-09-08-herdr-setup-design.md
    levels: {}
    status: not-implemented
    notes: Reads plugins.json and config.toml from disk; only integration state comes
      from the CLI, which stays unblocked. Phase 2 (herdr-setup:tests/test_diff_plugins.sh)
      proves the plugin section is byte-identical whether or not
      FAKE_HERDR_PROTOCOL_MISMATCH is set, since hs_manifest_plugins/hs_host_plugins/
      hs_resolve_ref never call herdr. Phase 3 (herdr-setup:tests/test_diff_config.sh)
      implements and unit-tests the config and integration sections and a
      hs_preflight_banner that names the state as cmd_diff's first line -- hs_diff_config
      reads config.toml from disk (never through herdr) and hs_diff_integrations calls
      `herdr integration status` directly, which the fake herdr harness exempts from its
      protocol-mismatch simulation, matching the real command. An end-to-end
      herdr-setup diff run proves the exit status (0 match / 1 drift) is unchanged
      under FAKE_HERDR_PROTOCOL_MISMATCH=1. Left not-implemented on purpose, per phase 10
      (herdr-setup:docs/superpowers/plans/2026-09-08-herdr-setup/10.yaml), which adds the
      level reference and flips this row once CI runs the suite.
  - id: socket-commands-refuse-under-mismatch
    capability: Version gate
    acceptance: apply, onboard and feed stop with one line naming the protocol
      mismatch and the restart needed, instead of parsing a JSON error object as an
      empty result.
    origin:
    - herdr-setup:docs/superpowers/specs/2026-09-08-herdr-setup-design.md
    levels: {}
    status: not-implemented
    notes: The failure this guards against reads as success having done nothing.
      Phase 1 (herdr-setup:tests/test_preflight.sh) unit-tests the two primitives
      this row depends on -- hs_require_socket refuses under mismatched/no-server/
      no-herdr with one stderr line and exit 3, and hs_herdr_json never returns a
      result from a failed herdr call -- but apply/absorb/onboard/feed are still
      phase 1 stubs that do not call hs_require_socket yet. Left not-implemented on
      purpose, pending phase 6 (herdr-setup:docs/superpowers/plans/2026-09-08-herdr-setup/06.yaml),
      which wires cmd_feed to hs_require_socket and is where this row actually flips.
      Phase 5 finding, not yet resolved -- this row's own wording names absorb
      alongside apply/onboard/feed, but the design doc's Commands > absorb and
      Errors and safety > Preflight sections do not name absorb there -- absorb never
      crosses the socket at all (it reads plugins.json and config.toml straight from
      disk, exactly like diff's plugin/config sections), so cmd_absorb (herdr-setup)
      deliberately does NOT call hs_require_socket -- a protocol mismatch or
      no-server host still lets absorb run. Whoever flips this row at phase 6 should
      either drop "absorb" from the acceptance wording to match the design doc, or
      decide absorb should gate on the socket after all and wire it there -- phase 5
      did not make that call unilaterally.
  - id: diff-detects-plugin-drift
    capability: Configuration sync
    acceptance: diff reports each manifest plugin as missing, matching its pinned ref,
      or moved, and lists host plugins the manifest does not name as unmanaged.
    origin:
    - herdr-setup:docs/superpowers/specs/2026-09-08-herdr-setup-design.md
    levels: {}
    status: not-implemented
    notes: Moved is decided by resolving the ref with git ls-remote against the commit
      Herdr recorded. Implemented and unit-tested in phase 2
      (herdr-setup:tests/test_diff_plugins.sh, herdr-setup:tests/test_manifest.sh,
      herdr-setup:tests/test_hostplugins.sh) -- hs_diff_plugins covers missing/ok/moved/
      ref-gone/unmanaged, and cmd_diff wires it to the real manifest and the host's
      plugins.json. Left not-implemented on purpose, per phase 10
      (herdr-setup:docs/superpowers/plans/2026-09-08-herdr-setup/10.yaml), which adds the
      level reference and flips this row once CI runs the suite.
  - id: apply-reproduces-manifest
    capability: Configuration sync
    acceptance: On a host missing every manifest plugin, apply installs them at their
      pinned refs and a following diff reports a match.
    origin:
    - herdr-setup:docs/superpowers/specs/2026-09-08-herdr-setup-design.md
    levels: {}
    status: not-implemented
    notes: The second-machine case the tool exists for. Phase 4
      (herdr-setup:tests/test_apply_plugins.sh) implements and unit-tests hs_apply_plugins
      -- a missing or ref-moved manifest plugin gets exactly one
      `plugin install <source> --ref <ref>` call (with `--yes` under HS_YES=1, none at all
      under HS_DRY_RUN=1), an already-matching plugin gets none, and cmd_apply refuses
      with exit 3 and makes no call at all under a protocol mismatch (hs_require_socket
      runs first, unconditionally). The "a following diff reports a match" half of this
      row is not separately exercised end to end -- hs_diff_plugins and hs_apply_plugins
      share hs_manifest_plugins/hs_host_plugins/hs_resolve_ref, so a diff after a
      successful apply reads the same host state apply just wrote, but no test drives
      apply then diff together against one fake host. Left not-implemented on purpose,
      per phase 10 (herdr-setup:docs/superpowers/plans/2026-09-08-herdr-setup/10.yaml),
      which adds the level reference and flips this row once CI runs the suite.
  - id: config-splice-preserves-plugin-blocks
    capability: Configuration sync
    acceptance: apply updates the operator's own config lines while leaving plugin-written
      marked blocks exactly where they were.
    origin:
    - herdr-setup:docs/superpowers/specs/2026-09-08-herdr-setup-design.md
    levels: {}
    status: not-implemented
    notes: A plugin owns its block; the tool must never eat it. Phase 3
      (herdr-setup:tests/test_blocks.sh) builds and unit-tests the two primitives this
      depends on -- hs_strip_plugin_blocks and hs_extract_plugin_blocks, matching the id
      in a `# --- added by <id> ...` marker against the id in its `# --- end <id> ---`
      rather than accepting any end marker, fatal (exit 2, naming the id) on an
      unterminated block or a stray end marker. These are read-only primitives also used
      by `diff`'s config section (herdr-setup:tests/test_diff_config.sh). Phase 4
      (herdr-setup:tests/test_apply_config.sh) implements and unit-tests the actual
      splice-and-preserve behaviour this row names -- hs_splice_config reinserts every
      block, unchanged and markers included, into the manifest's operator-line skeleton
      via a third `splice` walk mode that records each block's anchor as the number of
      operator lines that preceded it on the host, byte-exact in the steady state where
      the host's own stripped content already equals the manifest (the common case round
      to round), and still order-preserving otherwise; hs_apply_config only writes when
      the spliced content actually differs, backs the previous content up first, writes
      via a temp file in the same directory and renames it over the target, and calls
      `herdr server reload-config` exactly once. Left not-implemented on purpose, per
      phase 10 (herdr-setup:docs/superpowers/plans/2026-09-08-herdr-setup/10.yaml), which
      adds the level reference and flips this row once CI runs the suite.
  - id: absorb-apply-roundtrip-is-noop
    capability: Configuration sync
    acceptance: absorb followed by apply against an unchanged host makes no further
      change, and absorb refuses to run when the manifest has uncommitted edits.
    origin:
    - herdr-setup:docs/superpowers/specs/2026-09-08-herdr-setup-design.md
    levels: {}
    status: not-implemented
    notes: Guards the overwrite-not-merge design against eating a hand edit.
      Implemented and unit-tested in phase 5 (herdr-setup:tests/test_absorb.sh,
      herdr-setup:tests/test_roundtrip.sh) -- cmd_absorb rewrites manifest/plugins.list
      (source + requested_ref only, sorted by source, resolved_commit and managed_path
      dropped) and manifest/config.toml (plugin-written blocks stripped) straight from
      the host's plugins.json and config.toml on disk, refuses with exit 4 and writes
      nothing when `git status --porcelain -- manifest/` reports anything, and refuses
      with exit 2 rather than write a line containing $HOME or a /Users/ or /home/
      path. test_roundtrip.sh drives absorb then apply against one unchanged fake host
      and asserts zero plugin-install and zero reload-config calls, then a following
      diff exits 0 -- this is phase 4's byte-exact anchor case by construction, since
      the freshly-absorbed manifest/config.toml IS the host's own stripped content.
      Left not-implemented on purpose, per phase 10
      (herdr-setup:docs/superpowers/plans/2026-09-08-herdr-setup/10.yaml), which adds
      the level reference and flips this row once CI runs the suite.
  - id: onboard-offers-stale-integration
    capability: Agent onboarding
    acceptance: onboard lists the agents present on the host, reports an integration
      Herdr calls outdated with both versions, and installs a refresh only when accepted.
    origin:
    - herdr-setup:docs/superpowers/specs/2026-09-08-herdr-setup-design.md
    levels: {}
    status: not-implemented
    notes: Different hosts run different agents, so this is per-host and interactive.
  - id: feed-reports-live-sessions
    capability: Agent onboarding
    acceptance: feed reports a session id for every live agent pane and Herdr persists
      a record per pane; a following server restart brings each pane back running its
      agent's resume command rather than a bare shell.
    origin:
    - herdr-setup:docs/superpowers/specs/2026-09-08-herdr-setup-design.md
    levels: {}
    status: not-implemented
    notes: The end-to-end reason the tool exists. Verified live post-merge; Copilot
      unverified until a host with the CLI runs it.
