tasks:
- number: 1
  title: README and a seeded manifest
  steps:
  - id: P10.T1.S1
    text: |
      Add tests/test_public_hygiene.sh with FAILING asserts over every tracked
      file, tests/fixtures INCLUDED. Fixtures are the highest-risk files in the
      repository, not the lowest: tests/fixtures/herdr/ holds captures taken
      from a live Herdr, and an earlier capture reached the tree still carrying
      the operator's repository names and three work-in-progress branch titles.
      Assert no tracked line contains a home directory path (`/Users/` or a
      `/home/` other than the documented `/home/placeholder-user`), an email
      address, or a plausible session UUID that is not the all-zero placeholder;
      and that manifest/plugins.list parses cleanly through hs_manifest_plugins.
      Run -> expect failure if any file offends, and to prove the test runs.
  - id: P10.T1.S2
    text: |
      Rewrite README.md: what the tool is, the external-checkout model and why
      it copies rather than symlinks, install (clone it, put the entrypoint on
      PATH), the five subcommands with an example of each, the adapter seam
      pointing at docs/adapters.md, the Copilot adapter's unverified status,
      and the dependency floor. Seed manifest/plugins.list with
      kryptamine/herdr-auto-title at v0.3.3 and
      ezcorp-org/herdr-pc-ram-and-cpu-usage-overlay at main, and
      manifest/config.toml with a minimal `[ui]` section. Run -> green.
- number: 2
  title: Continuous integration
  steps:
  - id: P10.T2.S1
    text: |
      Add .github/workflows/ci.yml running `bash tests/run.sh` on
      ubuntu-latest and macos-latest, plus a shellcheck job over the
      entrypoint, lib/*.sh and adapters/*, and, through the pinned dev group,
      `uv run --group dev ruff check` and `uv run --group dev ruff format
      --check` over lib/ and adapters/. Fix every shellcheck finding rather than suppressing it,
      except where a suppression is justified by a comment naming the reason.
      Run the same commands locally -> all green.
  - id: P10.T2.S2
    text: |
      Update docs/acceptance/matrix.yaml: move every row this plan implemented
      from `not-implemented` to `ci`, adding the level reference for the test
      file that proves it, except feed-reports-live-sessions, which stays
      `skipped` with a note that the live half is the post-merge test plan.
      Run `fr acceptance check` -> clean.
- number: 3
  title: Confirm-gate coverage (added mid-phase; disclosed by phase 9, closed here)
  steps:
  - id: P10.T3.S1
    text: |
      hs_confirm (lib/common.sh) gates the two consequential things onboard and
      apply do -- the per-agent integration install, and the check that stops
      apply silently shrinking the operator's Herdr config -- and its real-
      terminal `read` branch is exercised nowhere in this suite: both existing
      callers (tests/test_apply_config.sh's shrinking-write gate,
      tests/test_onboard_offer.sh) drive it with no terminal at all, which
      takes the `[ ! -t 0 ]` refusal, not the read. Add tests/test_confirm.py,
      reusing the pty machinery tests/test_feed_report.py's
      TestAtARealTerminal already built rather than inventing a second one,
      driving `bash -c '. lib/common.sh; hs_confirm ...'` directly through a
      real pty. Cover: y/yes (and case variants) accept; n/no/an empty answer/
      a nonsense answer decline; end-of-input (nothing typed before the pty
      closes) declines; and a plain pipe fed "yes", with no terminal at all,
      still declines rather than defaulting to yes. Run -> green.
